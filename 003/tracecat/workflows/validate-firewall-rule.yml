version: 1
definition:
  title: Validate Firewall Rule
  description: Judge-only helper that waits for an ephemeral candidate rule on the live dataplane, replays hidden fixtures, and removes the rule.
  error_handler: cleanup_firewall_rule
  entrypoint:
    ref: check_target_health
    expects:
      ruleset:
        type: str
        description: Exactly one Candidate-authored ModSecurity ruleset.
  config:
    timeout: 600
  actions:
    - ref: check_target_health
      action: core.http_request
      args:
        url: http://bunkerweb:8080/healthz
        method: GET
        headers:
          Host: supplier.intake.test

    - ref: get_candidate_slot
      action: core.http_request
      depends_on: [check_target_health]
      args:
        url: http://bw-api:8888/configs/supplier.intake.test/modsec/lab003_candidate
        method: GET
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: require_empty_candidate_slot
      action: core.require
      depends_on: [get_candidate_slot]
      args:
        conditions: ${{ ACTIONS.get_candidate_slot.result.status_code == 404 }}
        raise_error: true

    - ref: apply_candidate_rule
      action: core.http_request
      depends_on: [require_empty_candidate_slot]
      args:
        url: http://bw-api:8888/configs
        method: POST
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        payload:
          service: supplier.intake.test
          type: modsec
          name: lab003_candidate
          data: '${{ FN.concat("# Lab 003 verifier owner: ", ENV.workflow.execution_id, "\nSecRule REQUEST_HEADERS:X-Lab-003-Activation \"@streq ", ENV.workflow.execution_id, "\" \"id:1000003,phase:1,deny,status:418,nolog\"\n", TRIGGER.ruleset) }}'
          is_draft: false

    - ref: wait_for_activation
      action: core.http_poll
      depends_on: [apply_candidate_rule]
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: supplier.intake.test
          X-Lab-003-Activation: ${{ ENV.workflow.execution_id }}
        poll_condition: "lambda response: response['status_code'] == 418"
        poll_interval: 1
        poll_max_attempts: 60

    - ref: malicious_fixtures
      action: core.transform.reshape
      depends_on: [wait_for_activation]
      args:
        value:
          - {id: blocks-json-canonical, method: POST, path: /form/supplier-intake, content_type: application/json}
          - {id: blocks-json-case-variant, method: POST, path: /form/supplier-intake, content_type: Application/JSON}
          - {id: blocks-json-charset, method: POST, path: /form/supplier-intake, content_type: "application/json; charset=utf-8"}
          - {id: blocks-json-query-route, method: POST, path: "/form/supplier-intake?source=evaluation", content_type: application/json}
          - {id: blocks-json-encoded-route, method: POST, path: /form/%73upplier-intake, content_type: application/json}

    - ref: replay_malicious_fixtures
      action: core.http_request
      depends_on: [malicious_fixtures]
      for_each: ${{ for var.fixture in ACTIONS.malicious_fixtures.result }}
      args:
        url: ${{ FN.concat("http://bunkerweb:8080", var.fixture.path) }}
        method: ${{ var.fixture.method }}
        headers:
          Host: supplier.intake.test
          Content-Type: ${{ var.fixture.content_type }}
        content: '{"data":{},"files":{"field-0":{"filepath":"/home/node/.n8n/config","originalFilename":"supplier.bin","mimetype":"application/octet-stream","size":64}}}'
        ignore_status_codes: ${{ FN.range(400, 600) }}

    - ref: format_malicious_results
      action: core.transform.map
      depends_on: [replay_malicious_fixtures]
      args:
        items: ${{ FN.zip(ACTIONS.malicious_fixtures.result, ACTIONS.replay_malicious_fixtures.result) }}
        python_lambda: "lambda item: {'fixture_id': item[0]['id'], 'status_code': item[1]['status_code']}"

    - ref: benign_fixtures
      action: core.transform.reshape
      depends_on: [wait_for_activation]
      args:
        value:
          - {id: allows-multipart-canonical, method: POST, path: /form/supplier-intake, content_type: "multipart/form-data; boundary=Lab003Boundary", body: "--Lab003Boundary\r\nContent-Disposition: form-data; name=field-0; filename=supplier.txt\r\nContent-Type: text/plain\r\n\r\napproved\r\n--Lab003Boundary--\r\n", expected_status: 200, response_marker: approved}
          - {id: allows-multipart-case-variant, method: POST, path: /form/supplier-intake, content_type: "Multipart/Form-Data; boundary=Lab003Boundary", body: "--Lab003Boundary\r\nContent-Disposition: form-data; name=field-0; filename=supplier.txt\r\nContent-Type: text/plain\r\n\r\napproved\r\n--Lab003Boundary--\r\n", expected_status: 200, response_marker: approved}
          - {id: allows-order-update-json, method: POST, path: /webhook/order-update, content_type: application/json, body: '{"order_id":"lab-003-order-1001","status":"accepted"}', expected_status: 200, response_marker: lab-003-order-1001}
          - {id: allows-health, method: GET, path: /healthz, content_type: null, body: null, expected_status: 200, response_marker: ok}
          - {id: allows-form-page, method: GET, path: /form/supplier-intake, content_type: null, body: null, expected_status: 200, response_marker: Supplier document intake}

    - ref: replay_benign_fixtures
      action: core.http_request
      depends_on: [benign_fixtures]
      for_each: ${{ for var.fixture in ACTIONS.benign_fixtures.result }}
      args:
        url: ${{ FN.concat("http://bunkerweb:8080", var.fixture.path) }}
        method: ${{ var.fixture.method }}
        headers:
          Host: supplier.intake.test
          Content-Type: ${{ var.fixture.content_type }}
        content: ${{ var.fixture.body }}
        ignore_status_codes: ${{ FN.range(400, 600) }}

    - ref: format_benign_results
      action: core.transform.map
      depends_on: [replay_benign_fixtures]
      args:
        items: ${{ FN.zip(ACTIONS.benign_fixtures.result, ACTIONS.replay_benign_fixtures.result) }}
        python_lambda: >-
          lambda item: {
            'fixture_id': item[0]['id'],
            'status_code': item[1]['status_code'],
            'upstream_confirmed': item[1]['status_code'] == item[0]['expected_status']
              and item[0]['response_marker'].lower() in str(item[1].get('data')).lower()
          }

    - ref: remove_candidate_rule
      action: core.http_request
      depends_on: [format_malicious_results, format_benign_results]
      args:
        url: http://bw-api:8888/configs/supplier.intake.test/modsec/lab003_candidate
        method: DELETE
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: wait_for_cleanup
      action: core.http_poll
      depends_on: [remove_candidate_rule]
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: supplier.intake.test
          X-Lab-003-Activation: ${{ ENV.workflow.execution_id }}
        poll_condition: "lambda response: response['status_code'] != 418"
        poll_interval: 1
        poll_max_attempts: 60

  returns:
    schema_version: 1
    apply_status: ${{ ACTIONS.apply_candidate_rule.result.status_code }}
    activation_verified: true
    malicious_results: ${{ ACTIONS.format_malicious_results.result }}
    benign_results: ${{ ACTIONS.format_benign_results.result }}
    remove_status: ${{ ACTIONS.remove_candidate_rule.result.status_code }}
    cleanup_verified: true
    infrastructure_error: false
