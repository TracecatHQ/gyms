version: 1
definition:
  title: Cleanup Firewall Rule
  description: Error handler that removes only the failed execution's candidate firewall rule.
  entrypoint:
    ref: get_candidate_rule
  config:
    timeout: 120
  actions:
    - ref: get_candidate_rule
      action: core.http_request
      args:
        url: http://bw-api:8888/configs/supplier.intake.test/modsec/lab003_candidate?with_data=true
        method: GET
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: owns_candidate_rule
      action: core.transform.map
      depends_on: [get_candidate_rule]
      args:
        items:
          - response: ${{ ACTIONS.get_candidate_rule.result }}
            owner: ${{ TRIGGER.orig_wf_exec_id }}
        python_lambda: >-
          lambda item: (
            item['response']['status_code'] == 200
            and ('# Lab 003 verifier owner: ' + item['owner'])
            in str((((item['response'].get('data') or {}).get('config') or {}).get('data') or ''))
          )

    - ref: should_cleanup
      action: core.transform.reshape
      depends_on: [owns_candidate_rule]
      args:
        value: ${{ ACTIONS.owns_candidate_rule.result[0] || ACTIONS.get_candidate_rule.result.status_code == 404 }}

    - ref: remove_candidate_rule
      action: core.http_request
      depends_on: [should_cleanup]
      run_if: ${{ ACTIONS.owns_candidate_rule.result[0] }}
      args:
        url: http://bw-api:8888/configs/supplier.intake.test/modsec/lab003_candidate
        method: DELETE
        auth:
          username: lab-admin
          password: ${{ SECRETS.lab_003_waf.BUNKERWEB_API_TOKEN }}
        ignore_status_codes: [404]

    - ref: wait_for_owned_cleanup
      action: core.http_poll
      depends_on: [remove_candidate_rule]
      run_if: ${{ ACTIONS.owns_candidate_rule.result[0] }}
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: supplier.intake.test
          X-Lab-003-Activation: ${{ TRIGGER.orig_wf_exec_id }}
        poll_condition: "lambda response: response['status_code'] != 418"
        poll_interval: 1
        poll_max_attempts: 60

    - ref: wait_for_absent_cleanup
      action: core.http_poll
      depends_on: [should_cleanup]
      run_if: ${{ ACTIONS.get_candidate_rule.result.status_code == 404 }}
      args:
        url: http://bunkerweb:8080/__lab_003_activation
        method: GET
        headers:
          Host: supplier.intake.test
          X-Lab-003-Activation: ${{ TRIGGER.orig_wf_exec_id }}
        poll_condition: "lambda response: response['status_code'] != 418"
        poll_interval: 1
        poll_max_attempts: 60

  returns:
    owned_rule: ${{ ACTIONS.owns_candidate_rule.result[0] }}
    remove_status: ${{ ACTIONS.remove_candidate_rule.result.status_code if ACTIONS.owns_candidate_rule.result[0] else None }}
    cleanup_verified: ${{ ACTIONS.should_cleanup.result }}
