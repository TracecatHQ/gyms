x-tracecat-enterprise: &tracecat-enterprise
  ENTERPRISE_EDITION: "true"
  TRACECAT__EE_MULTI_TENANT: "true"
  TRACECAT__FEATURE_FLAGS: agent-channels,agent-fs-persistence,ai-ranking,workflow-concurrency-limits

services:
  splunk:
    image: ${GYM_SPLUNK_IMAGE:?missing Gym 001 Splunk image}
    platform: linux/amd64
    restart: unless-stopped
    networks: [core]
    ports:
      - "127.0.0.1:${SPLUNK_WEB_PORT}:8000"
    environment:
      SPLUNK_PASSWORD: ${SPLUNK_ADMIN_PASSWORD:?run SPLUNK_ACCEPT_TERMS=yes just up}
      SPLUNK_START_ARGS: ${SPLUNK_START_ARGS:?Splunk terms acceptance missing}
      SPLUNK_GENERAL_TERMS: ${SPLUNK_GENERAL_TERMS:?Splunk terms acceptance missing}
      SPLUNK_LICENSE_URI: /run/gym-assets/Splunk.License
      SPLUNK_APPS_URL: /lab/assets/splunk-mcp-server_200.tgz
      SPLUNKD_SSL_ENABLE: "false"
      SPLUNK_SKIP_PREINSTALL_CPU_CHECKS_CORRUPTING_DATA_IF_UNSUPPORTED: "1"
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
      - ${GYM_ROOT:?missing GYM_ROOT}/assets/Splunk.License:/run/gym-assets/Splunk.License:ro
    healthcheck:
      test: ["CMD", "/opt/gym/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 2m

  splunk-mcp-compat:
    image: ${GYM_CONTROL_IMAGE:?missing Gym 001 control image}
    restart: unless-stopped
    networks: [core]
    environment:
      SPLUNK_MCP_UPSTREAM_URL: http://splunk:8089/services/mcp
    command: ["mcp-proxy"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      splunk: {condition: service_healthy}

  tracecat-seed:
    image: ${GYM_CONTROL_IMAGE:?missing Gym 001 control image}
    profiles: ["bootstrap"]
    restart: "no"
    networks: [core-db]
    environment:
      <<: *tracecat-enterprise
      TRACECAT__DB_URI: ${TRACECAT__DB_URI}
      TRACECAT__DB_SSLMODE: ${TRACECAT__DB_SSLMODE}
      TRACECAT__DB_ENCRYPTION_KEY: ${TRACECAT__DB_ENCRYPTION_KEY}
      TRACECAT__SERVICE_KEY: ${TRACECAT__SERVICE_KEY}
      TRACECAT__SIGNING_SECRET: ${TRACECAT__SIGNING_SECRET}
      USER_AUTH_SECRET: ${USER_AUTH_SECRET}
      TRACECAT__DEV_USER_EMAIL: ${TRACEcat_TENANT_EMAIL}
      TRACECAT__DEV_USER_PASSWORD: ${TRACEcat_TENANT_PASSWORD}
      TRACECAT__DEV_SUPERUSER_EMAIL: ${TRACEcat_SUPERADMIN_EMAIL}
      TRACECAT__DEV_SUPERUSER_PASSWORD: ${TRACEcat_SUPERADMIN_PASSWORD}
      TRACECAT__DEV_DEFAULT_TIER_ENTITLEMENTS: all
      TRACECAT__DEV_ORG_ROLE: organization-owner
      TRACECAT__DEV_WORKSPACE_ROLE: workspace-admin
    command: ["seed"]
    depends_on:
      migrations: {condition: service_completed_successfully}

  gym-reconciler:
    image: ${GYM_CONTROL_IMAGE:?missing Gym 001 control image}
    profiles: ["bootstrap"]
    restart: "no"
    networks: [core]
    environment:
      <<: *tracecat-enterprise
      TRACEcat_INTERNAL_API_URL: http://api:8000
      TRACEcat_TENANT_EMAIL: ${TRACEcat_TENANT_EMAIL}
      TRACEcat_TENANT_PASSWORD: ${TRACEcat_TENANT_PASSWORD}
      SPLUNK_API_URL: http://splunk:8089
      SPLUNK_ADMIN_USER: ${SPLUNK_ADMIN_USER}
      SPLUNK_ADMIN_PASSWORD: ${SPLUNK_ADMIN_PASSWORD}
      SPLUNK_MCP_USER: ${SPLUNK_MCP_USER}
      SPLUNK_MCP_PASSWORD: ${SPLUNK_MCP_PASSWORD}
      SPLUNK_MCP_URL: http://splunk-mcp-compat:8000/mcp
      GYM_RECONCILE_TIMEOUT_SECONDS: ${GYM_RECONCILE_TIMEOUT_SECONDS:-2400}
      GYM_DATA_POLL_SECONDS: ${GYM_DATA_POLL_SECONDS:-10}
    command: ["internal-reconcile", "reconcile"]

  eval-runner:
    image: ${GYM_CONTROL_IMAGE:?missing Gym 001 control image}
    profiles: ["evaluation"]
    restart: "no"
    networks: [core]
    environment:
      TRACEcat_INTERNAL_API_URL: http://api:8000
      TRACEcat_PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      TRACEcat_TENANT_EMAIL: ${TRACEcat_TENANT_EMAIL}
      TRACEcat_TENANT_PASSWORD: ${TRACEcat_TENANT_PASSWORD}
    volumes:
      - ${GYM_ROOT:?missing GYM_ROOT}/eval-results:/opt/gym/eval-results
    command: ["internal-eval"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  splunk-etc:
  splunk-var:
