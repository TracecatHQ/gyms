version: 1
definition:
  title: Candidate Run
  description: Run the Candidate preset once for every selected Case Template and repetition.
  entrypoint:
    ref: search_case_templates
    expects:
      case_ids:
        type: list[str]
        default: []
        description: Optional stable Case Template IDs; empty selects every enabled template.
      repetitions:
        type: int
        default: 1
        description: Fresh Candidate trials per selected Case Template.
      candidate_preset_version_id:
        type: str
        description: Candidate preset head UUID observed by the caller; Judge Run verifies it against every resulting session.
      candidate_preset_version:
        type: int
        description: Candidate preset head number recorded for audit.
      judge_preset_version_id:
        type: str
        description: Judge preset head UUID reserved for this Evaluation Run.
      judge_preset_version:
        type: int
        description: Judge preset head number recorded for audit.
      candidate_model:
        type: str
        description: Candidate model frozen by the caller.
      judge_model:
        type: str
        description: Judge model frozen by the caller.
  config:
    timeout: 7200
  actions:
    - ref: search_case_templates
      action: core.table.search_rows
      args:
        table: case_templates
        limit: 1000

    - ref: enabled_case_templates
      action: core.transform.filter
      depends_on: [search_case_templates]
      args:
        items: ${{ ACTIONS.search_case_templates.result }}
        python_lambda: "lambda row: row.get('enabled') is True"

    - ref: filter_case_templates
      action: core.transform.is_in
      depends_on: [enabled_case_templates]
      args:
        items: ${{ ACTIONS.enabled_case_templates.result }}
        collection: ${{ TRIGGER.case_ids }}
        python_lambda: "lambda row: row.get('case_id')"

    - ref: select_case_templates
      action: core.transform.reshape
      depends_on: [enabled_case_templates, filter_case_templates]
      args:
        value: ${{ ACTIONS.enabled_case_templates.result if FN.is_empty(TRIGGER.case_ids) else ACTIONS.filter_case_templates.result }}

    - ref: expand_trials
      action: core.transform.reshape
      depends_on: [select_case_templates]
      args:
        value: ${{ FN.iter_product(ACTIONS.select_case_templates.result, FN.create_range(1, FN.add(TRIGGER.repetitions, 1))) }}

    - ref: require_trials
      action: core.require
      depends_on: [select_case_templates, expand_trials]
      args:
        conditions:
          - ${{ TRIGGER.repetitions > 0 }}
          - ${{ FN.length(ACTIONS.select_case_templates.result) > 0 }}
          - ${{ FN.length(ACTIONS.expand_trials.result) > 0 }}
          - ${{ FN.is_empty(TRIGGER.case_ids) || FN.length(ACTIONS.select_case_templates.result) == FN.length(TRIGGER.case_ids) }}
        require_all: true
        raise_error: true

    - ref: selected_case_ids
      action: core.transform.map
      depends_on: [require_trials]
      args:
        items: ${{ ACTIONS.select_case_templates.result }}
        python_lambda: "lambda row: row['case_id']"

    - ref: start_evaluation_run
      action: core.table.insert_row
      depends_on: [selected_case_ids]
      args:
        table: evaluation_runs
        row_data:
          schema_version: 1
          gym_id: ${{ ACTIONS.select_case_templates.result[0].gym_id }}
          evaluation_run_id: ${{ ENV.workflow.execution_id }}
          status: candidate_running
          case_ids: ${{ ACTIONS.selected_case_ids.result }}
          repetitions: ${{ TRIGGER.repetitions }}
          candidate_run_execution_id: ${{ ENV.workflow.execution_id }}
          candidate_preset_version_id: ${{ TRIGGER.candidate_preset_version_id }}
          candidate_preset_version: ${{ TRIGGER.candidate_preset_version }}
          candidate_model: ${{ TRIGGER.candidate_model }}
          judge_run_execution_id: null
          judge_preset_version_id: ${{ TRIGGER.judge_preset_version_id }}
          judge_preset_version: ${{ TRIGGER.judge_preset_version }}
          judge_model: ${{ TRIGGER.judge_model }}
          rubric_id: ${{ ACTIONS.select_case_templates.result[0].rubric_id }}
          rubric_version: ${{ ACTIONS.select_case_templates.result[0].rubric_version }}
          frozen_inputs: ${{ ACTIONS.select_case_templates.result }}
          trials: []
          errors: []
          created_at: ${{ FN.utcnow(True) }}
          candidate_completed_at: null
          judged_at: null

    - ref: create_trial_cases
      action: core.cases.create_case
      depends_on: [require_trials, start_evaluation_run]
      for_each: ${{ for var.trial in ACTIONS.expand_trials.result }}
      args:
        summary: ${{ var.trial[0].case.title }}
        description: ${{ var.trial[0].case.description }}
        priority: ${{ var.trial[0].case.priority }}
        severity: ${{ var.trial[0].case.severity }}
        status: new
        fields: ${{ var.trial[0].case.fields }}
        payload: ${{ var.trial[0].case.payload }}
        tags: ${{ var.trial[0].case.tags }}
        create_missing_tags: true

    - ref: run_candidates
      action: ai.preset_agent
      depends_on: [create_trial_cases]
      for_each: ${{ for var.item in FN.zip_iterables(ACTIONS.expand_trials.result, ACTIONS.create_trial_cases.result) }}
      retry_policy:
        max_attempts: 1
        timeout: 3600
      args:
        preset: candidate
        user_prompt: >-
          Investigate Tracecat Case ${{ var.item[1].id }}. The Case is the complete
          unit of work. Put your visible analysis, evidence, timeline, decision,
          and final answer in the Case description, tags, or comments. Do not
          reveal hidden evaluation material. Your final return will also be
          saved as a Case comment at the submission cutoff.
        max_tool_calls: 24
        max_requests: 64

    - ref: save_candidate_returns
      action: core.cases.create_comment
      depends_on: [run_candidates]
      for_each: ${{ for var.item in FN.zip_iterables(ACTIONS.create_trial_cases.result, ACTIONS.run_candidates.result) }}
      args:
        case_id: ${{ var.item[0].id }}
        content: ${{ var.item[1].output }}

    - ref: capture_submission_cases
      action: core.cases.get_case
      depends_on: [save_candidate_returns]
      for_each: ${{ for var.case in ACTIONS.create_trial_cases.result }}
      args:
        case_id: ${{ var.case.id }}

    - ref: capture_submission_comments
      action: core.cases.list_comments
      depends_on: [save_candidate_returns]
      for_each: ${{ for var.case in ACTIONS.create_trial_cases.result }}
      args:
        case_id: ${{ var.case.id }}

    - ref: build_submissions
      action: core.transform.reshape
      depends_on: [capture_submission_cases, capture_submission_comments]
      for_each: ${{ for var.item in FN.zip_iterables(ACTIONS.capture_submission_cases.result, ACTIONS.capture_submission_comments.result) }}
      args:
        value:
          case: ${{ var.item[0] }}
          comments: ${{ var.item[1] }}

    - ref: build_trials
      action: core.transform.reshape
      depends_on: [build_submissions]
      for_each: ${{ for var.item in FN.zip_iterables(ACTIONS.expand_trials.result, ACTIONS.create_trial_cases.result, ACTIONS.run_candidates.result, ACTIONS.build_submissions.result) }}
      args:
        value:
          trial_id: ${{ var.item[1].id }}
          case_id: ${{ var.item[0][0].case_id }}
          trial_number: ${{ var.item[0][1] }}
          status: completed
          candidate_session_id: ${{ var.item[2].session_id }}
          candidate_preset_version_id: ${{ TRIGGER.candidate_preset_version_id }}
          candidate_model: ${{ TRIGGER.candidate_model }}
          case_template_sha256: ${{ var.item[0][0].case_template_sha256 }}
          submission: ${{ var.item[3] }}
          submission_sha256: ${{ FN.hash_sha256(FN.serialize_json(var.item[3])) }}
          candidate_completed_at: ${{ FN.utcnow(True) }}
          oracle: ${{ var.item[0][0].oracle }}
          rubric: ${{ var.item[0][0].rubric }}

    - ref: complete_evaluation_run
      action: core.table.update_row
      depends_on: [build_trials]
      args:
        table: evaluation_runs
        row_id: ${{ ACTIONS.start_evaluation_run.result.id }}
        row_data:
          status: candidate_completed
          trials: ${{ ACTIONS.build_trials.result }}
          candidate_completed_at: ${{ FN.utcnow(True) }}

  returns:
    evaluation_run_id: ${{ ENV.workflow.execution_id }}
    candidate_run_execution_id: ${{ ENV.workflow.execution_id }}
    trials: ${{ ACTIONS.build_trials.result }}
